[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eem-acc"
version = "0.1.0"
description = "Self-reflective agentic AI with adaptive concurrency control (thesis code)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the fast suite runs by default; run the others explicitly, e.g.  pytest -m notebook
addopts = "-m 'not notebook and not gpu and not llm and not drive and not colab'"
markers = [
    "notebook: executes a Colab notebook headlessly (slow, needs nbclient + ipykernel)",
    "gpu: needs a GPU",
    "llm: needs the real local LLM (llama-cpp-python + model weights)",
    "drive: needs Google Drive",
    "colab: can only be run inside Google Colab",
]
